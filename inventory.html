<!DOCTYPE html>
<html>
<head>
  <title>Smart Scale</title>
</head>
<body>

<!-- Navbar will load here -->
<div id="navbar"></div>

<script>
  fetch("nav.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;
    });
</script>

<h1>Smart Scale</h1>

<table border="1" cellpadding="8" cellspacing="0" id="inventoryTable">
  <thead>
    <tr>
      <th>Product ID</th>
      <th>Name</th>
      <th>Shelf ID</th>
      <th>Location</th>
      <th>Display Status</th>
      <th>Current Quantity</th>
      <th>Current Weight (kg)</th>
      <th>Last Updated</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const apiURL = "https://e3egai64zh.execute-api.eu-north-1.amazonaws.com/items";

let allData = [];

fetch(apiURL)
  .then(res => res.json())
  .then(data => {
    if (typeof data === "string") {
      allData = JSON.parse(data);
    } else if (data.body) {
      allData = JSON.parse(data.body);
    } else {
      allData = data;
    }

    renderTable(allData);
  });

function renderTable(data) {
  const tableBody = document.querySelector("#inventoryTable tbody");
  tableBody.innerHTML = "";

  data.forEach(row => {
    const tr = document.createElement("tr");

    const formattedWeight = Number(row.current_total_weight).toFixed(2);
    const formattedDate = row.last_updated.split(".")[0];

    tr.innerHTML = `
      <td>${row.product_id ?? "-"}</td>
      <td>${row.name ?? "-"}</td>
      <td>${row.shelf_id}</td>
      <td>${row.location}</td>
      <td>${row.display_status}</td>
      <td>${row.current_quantity}</td>
      <td>${formattedWeight}</td>
      <td>${formattedDate}</td>
    `;

    tableBody.appendChild(tr);
  });
}
</script>

</body>
</html>
