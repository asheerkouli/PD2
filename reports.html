<!DOCTYPE html>
<html>
<head> 
  <title>Reports</title>
</head>
<body>

<!-- Navbar will load here -->
<div id="navbar"></div>

<script>
  fetch("nav.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;
    });
</script>

<h1>Reports</h1>

<p>Items with low stock (less than 5 in quantity).</p>

<table border="1" cellpadding="8" cellspacing="0" id="reportsTable">
  <thead>
    <tr>
      <th>Product ID</th>
      <th>Name</th>
      <th>Shelf ID</th>
      <th>Location</th>
      <th>Display Status</th>
      <th>Current Quantity</th>
      <th>Current Weight (kg)</th>
      <th>Last Updated</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h2>Inventory Summary</h2>
<table border="1" cellpadding="8" cellspacing="0" id="summaryTable">
  <thead>
    <tr>
      <th>Location</th>
      <th>Total Items</th>
      <th>Low Stock Items (&lt;5)</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const apiURL = "https://e3egai64zh.execute-api.eu-north-1.amazonaws.com/items";

fetch(apiURL)
  .then(res => res.json())
  .then(data => {
    let allData = [];

    if (Array.isArray(data)) {
      allData = data;
    } else if (data.body) {
      allData = JSON.parse(data.body);
    } else {
      allData = [];
    }

    const tableBody = document.querySelector("#reportsTable tbody");

    // Filter: only items with quantity < 5
    const lowStock = allData.filter(row => Number(row.current_quantity) < 5);

    tableBody.innerHTML = "";

    lowStock.forEach(row => {
      const tr = document.createElement("tr");

      const formattedWeight = Number(row.current_total_weight).toFixed(2);
      const dateObj = new Date(row.last_updated);
      const formattedDate = dateObj.getFullYear() + "-" +
        String(dateObj.getMonth() + 1).padStart(2, '0') + "-" +
        String(dateObj.getDate()).padStart(2, '0') + " " +
        String(dateObj.getHours()).padStart(2, '0') + ":" +
        String(dateObj.getMinutes()).padStart(2, '0');

      tr.innerHTML = `
        <td>${row.product_id ?? "-"}</td>
        <td>${row.name ?? "-"}</td>
        <td>${row.shelf_id}</td>
        <td>${row.location}</td>
        <td>${row.display_status}</td>
        <td style="color: red; font-weight: bold;">${row.current_quantity}</td>
        <td>${formattedWeight}</td>
        <td>${formattedDate}</td>
      `;

      tableBody.appendChild(tr);
    });

    // Inventory Summary section
    const summary = {};

    allData.forEach(row => {
      const loc = row.location || "unknown";
      if (!summary[loc]) {
        summary[loc] = { total: 0, low: 0 };
      }

      summary[loc].total++;
      if (Number(row.current_quantity) < 5) {
        summary[loc].low++;
      }
    });

    const summaryBody = document.querySelector("#summaryTable tbody");
    summaryBody.innerHTML = "";

    Object.keys(summary).forEach(loc => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${loc}</td>
        <td>${summary[loc].total}</td>
        <td>${summary[loc].low}</td>
      `;

      summaryBody.appendChild(tr);
    });
  })
  .catch(err => console.error("Error loading API:", err));
</script>

</body>
</html>
