<!DOCTYPE html>
<html>
<head>
  <title>Smart Scale</title>
</head>
<body>

<!-- Navbar will load here -->
<div id="navbar"></div>

<script>
  fetch("nav.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;
    });
</script> 

<h1 style="font-size: 36px; margin-top: 20px;">
  PROJEKTKURS 2 - SMART SCALE
</h1>

<!-- Search -->
<input type="text" id="searchInput" placeholder="Product ID or Name" style="width: 300px; padding: 8px;">
<button style="padding: 8px;" onclick="searchTable()">Search</button>

<br><br>

<!-- Result table -->
<table border="1" cellpadding="8" cellspacing="0" id="searchTable">
  <thead>
    <tr>
      <th>Product ID</th>
      <th>Name</th>
      <th>Shelf ID</th>
      <th>Location</th>
      <th>Display Status</th>
      <th>Current Quantity</th>
      <th>Current Weight (kg)</th>
      <th>Last Updated</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const apiURL = "https://e3egai64zh.execute-api.eu-north-1.amazonaws.com/items";

let allData = [];

// Load data once from AWS
fetch(apiURL)
  .then(res => res.json())
  .then(data => {
    if (Array.isArray(data)) {
      allData = data;
    } else if (data.body) {
      allData = JSON.parse(data.body);
    } else {
      allData = [];
    }
  });

document.getElementById("searchInput").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    searchTable();
  }
});

// Search function
function searchTable() {
  const input = document.getElementById("searchInput").value.trim();
  const tableBody = document.querySelector("#searchTable tbody");

  tableBody.innerHTML = "";

  const filtered = allData.filter(row =>
    (row.product_id != null && row.product_id.toString() === input) ||
    (row.name && row.name.toLowerCase().includes(input.toLowerCase()))
  );

  filtered.forEach(row => {
    const tr = document.createElement("tr");

    const formattedWeight = Number(row.current_total_weight).toFixed(2);
    const dateObj = new Date(row.last_updated);
    const formattedDate = dateObj.getFullYear() + "-" +
      String(dateObj.getMonth() + 1).padStart(2, '0') + "-" +
      String(dateObj.getDate()).padStart(2, '0') + " " +
      String(dateObj.getHours()).padStart(2, '0') + ":" +
      String(dateObj.getMinutes()).padStart(2, '0');

    tr.innerHTML = `
      <td>${row.product_id ?? "-"}</td>
      <td>${row.name ?? "-"}</td>
      <td>${row.shelf_id}</td>
      <td>${row.location}</td>
      <td>${row.display_status}</td>
      <td>${row.current_quantity}</td>
      <td>${formattedWeight}</td>
      <td>${formattedDate}</td>
    `;

    tableBody.appendChild(tr);
  });
}
</script>

</body>
</html>
